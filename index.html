// ---- update
function update(dt) {
  T += dt; st += dt; tickT -= dt;
  for (const p of pins) if (p.hit > 0) p.hit -= dt;
  if (tubeFlash > 0) tubeFlash -= dt; if (eqFlash > 0) eqFlash -= dt; if (tileFlash.t > 0) tileFlash.t -= dt;
  for (const gt of GATES) if (gt.flash > 0) gt.flash -= dt; if (showMult.t > 0) showMult.t -= dt;
  tick(dt);
  if (trayShow !== tray) {   // the counter closes most of the gap each second, never slower than 40/s, so even +4000 lands in under two seconds
    const gap = tray - trayShow, step = Math.min(Math.abs(gap), Math.max(40, Math.abs(gap) * 6) * dt);
    trayShow += Math.sign(gap) * step; if (Math.abs(tray - trayShow) < .5) trayShow = tray;
    coinT -= dt; if (coinT <= 0) { if (gap > 0) SFX.coin(); else SFX.pay(); coinT = 1 / 14; }
  }
  if (flash > 0) flash -= dt;
  if (state === 'play') { if (pot >= 1000) achieve('pot1000'); if (night >= 10) achieve('nights10'); }
  if (state === 'play' && debt > 0 && tray >= debt && !seen.canPay) { seen.canPay = true; pop('够还清了！球停了就能走', CX, 60, '#8aff9a', 10, 3); }
  if (state === 'play') {
    if (quiet() && (shots <= 0 || tray <= 0)) { idleT += dt; if (idleT > .6) endNight(); } else idleT = 0;
    if ((shots <= 0 || tray <= 0) && !fever && LAUNCH.length === 0) { endT += dt; if (endT > 8) for (const b of balls) b.gone = true; } else endT = 0;   // whatever is still rattling around after 8 s is swept away
  }
  else if (state === 'pay') {
    if (!paid && st > .5) {
      if (tray >= debt) { tray -= debt; debt = 0; won = true; paid = true; payMsg = '一次还清！'; }
      else if (nightsLeft() <= 1) { save('pot', pot); SFX.fail(); payMsg = '到期了'; go('over'); return; }
      else if (tray >= quota + 20 || loans >= loansMax()) { if (tray >= quota) { tray -= quota; paid = true; payMsg = '天亮了，交利息 ' + quota; } else { save('pot', pot); SFX.fail(); go('over'); return; } }   // paying must leave a stake of 20, or the cat steps in
      else { loanAmt = Math.ceil(LOAN0 * Math.pow(LOAN_GROW, loans)) * unit(); catTake(); go('loan'); return; }
    }
    if (paid && Math.abs(trayShow - tray) < .01 && st > 1.6) {
      if (won) { if (stage > best) { best = stage; save('iou', best); } achieve('clear1'); if (stage >= 2) achieve('clear2'); if (loans === 0) achieve('noloan'); if (loans >= 3) achieve('loan3'); SFX.jackpot(); go('win'); }
      else { if (upgrades.potint) pot = Math.ceil(pot * 1.1); if (syn('three')) pot = Math.ceil(pot * 1.05); save('pot', pot); night++; quota = interestNow(); shots = SHOTS; houseAct(); go('house'); }
    }
  } else if (state === 'house') { if (st > 1.6) { picks = rollPicks(); rerolls = 0; buysTonight = 0; nextField = rollField(); go('pick'); } }
  for (let i = POPS.length - 1; i >= 0; i--) { const p = POPS[i]; p.life -= dt; p.y -= 14 * dt; if (p.life <= 0) POPS.splice(i, 1); }
  for (let i = PARTS.length - 1; i >= 0; i--) { const q = PARTS[i]; q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.g || 0) * dt; if (q.life <= 0 || q.y > 300) PARTS.splice(i, 1); }
  if (state === 'play' && field !== 'calm') fieldAmb(dt); if (fieldBanner > 0) fieldBanner -= dt;
}
